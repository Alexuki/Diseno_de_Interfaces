<?xml version="1.0" encoding="UTF-8"?>
<!-- Documento pixelado: rejilla de 12 x 16 píxeles. Cada <rect> es un tramo horizontal de píxeles del mismo color.
     shape-rendering="crispEdges" = bordes nítidos, sin suavizado, al ampliarlo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 16" shape-rendering="crispEdges">
  <g fill="#000000"> <!-- contorno -->
    <rect x="0" y="0" width="8" height="1"/>
    <rect x="0" y="1" width="1" height="1"/>
    <rect x="7" y="1" width="2" height="1"/>
    <rect x="0" y="2" width="1" height="1"/>
    <rect x="7" y="2" width="1" height="1"/>
    <rect x="9" y="2" width="1" height="1"/>
    <rect x="0" y="3" width="1" height="1"/>
    <rect x="7" y="3" width="1" height="1"/>
    <rect x="10" y="3" width="1" height="1"/>
    <rect x="0" y="4" width="1" height="1"/>
    <rect x="7" y="4" width="5" height="1"/>
    <rect x="0" y="5" width="1" height="1"/>
    <rect x="11" y="5" width="1" height="1"/>
    <rect x="0" y="6" width="1" height="1"/>
    <rect x="11" y="6" width="1" height="1"/>
    <rect x="0" y="7" width="1" height="1"/>
    <rect x="11" y="7" width="1" height="1"/>
    <rect x="0" y="8" width="1" height="1"/>
    <rect x="11" y="8" width="1" height="1"/>
    <rect x="0" y="9" width="1" height="1"/>
    <rect x="11" y="9" width="1" height="1"/>
    <rect x="0" y="10" width="1" height="1"/>
    <rect x="11" y="10" width="1" height="1"/>
    <rect x="0" y="11" width="1" height="1"/>
    <rect x="11" y="11" width="1" height="1"/>
    <rect x="0" y="12" width="1" height="1"/>
    <rect x="11" y="12" width="1" height="1"/>
    <rect x="0" y="13" width="1" height="1"/>
    <rect x="11" y="13" width="1" height="1"/>
    <rect x="0" y="14" width="1" height="1"/>
    <rect x="11" y="14" width="1" height="1"/>
    <rect x="0" y="15" width="12" height="1"/>
  </g>
  <g fill="#ffffff"> <!-- papel -->
    <rect x="1" y="1" width="6" height="1"/>
    <rect x="1" y="2" width="6" height="1"/>
    <rect x="1" y="3" width="6" height="1"/>
    <rect x="1" y="4" width="6" height="1"/>
    <rect x="1" y="5" width="10" height="1"/>
    <rect x="1" y="6" width="1" height="1"/>
    <rect x="9" y="6" width="2" height="1"/>
    <rect x="1" y="7" width="10" height="1"/>
    <rect x="1" y="8" width="1" height="1"/>
    <rect x="10" y="8" width="1" height="1"/>
    <rect x="1" y="9" width="10" height="1"/>
    <rect x="1" y="10" width="1" height="1"/>
    <rect x="10" y="10" width="1" height="1"/>
    <rect x="1" y="11" width="10" height="1"/>
    <rect x="1" y="12" width="1" height="1"/>
    <rect x="7" y="12" width="4" height="1"/>
    <rect x="1" y="13" width="10" height="1"/>
    <rect x="1" y="14" width="10" height="1"/>
  </g>
  <g fill="#c0c0c0"> <!-- esquina doblada -->
    <rect x="8" y="2" width="1" height="1"/>
    <rect x="8" y="3" width="2" height="1"/>
  </g>
  <g fill="#5c94fc"> <!-- líneas de texto -->
    <rect x="2" y="6" width="7" height="1"/>
    <rect x="2" y="8" width="8" height="1"/>
    <rect x="2" y="10" width="8" height="1"/>
    <rect x="2" y="12" width="5" height="1"/>
  </g>
</svg>
