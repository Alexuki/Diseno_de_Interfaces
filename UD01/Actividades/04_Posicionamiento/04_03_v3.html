<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Posicionamiento - Ejercicio 3 - Versión Grid</title>
        <style>
            body {
                box-sizing: border-box;
                margin: 0;
                padding: 8px;
                height: 100vh;
            }
            .container {
                display: grid;
                box-sizing: border-box;
                border: 2px solid black;
                height: 100%;
                padding: 10px;
                gap: 10px;
                grid-template-columns: 1fr 1fr;
            }
            .column {
                display: grid;
                gap: 10px;
            }
            .left {
                grid-template-rows: 1fr 1fr;
            }
            .right {
                grid-template-rows: 1fr 3fr;
            }

            .green {
                background-color: #008000;
            }
            .blue {
                background-color: blue;
            }
            .red {
                background-color: red;
            }
            .violet {
                background-color: #8a2be2;
            }
        </style>
    </head>

    <body>

        <div class="container">
            <div class="column left">
                <div class="green"></div>
                <div class="red"></div>
            </div>
            <div class="column right">
                <div class="blue"></div>
                <div class="violet"></div>
            </div>
        </div>
        
    </body>
</html>
