<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Posicionamiento - Ejercicio 3 - Versión Flex</title>
        <style>
            body {
                box-sizing: border-box;
                margin: 0;
                padding: 8px;
                height: 100vh;
            }
            .container {
                box-sizing: border-box;
                display: flex;
                gap: 10px;
                box-sizing: border-box;
                border: 2px solid black;
                height: 100%;
                padding: 10px;
            }
            .column {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .green {
                background-color: green;
                flex: 1;
            }
            .blue {
                background-color: blue;
                flex: 1;
            }
            .red {
                background-color: red;
                flex: 1;
            }
            .violet {
                background-color: violet;
                flex: 3;
            }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="column">
                <div class="green"></div>
                <div class="red"></div>
            </div>

            <div class="column">
                <div class="blue"></div>
                <div class="violet"></div>
            </div>
            
        </div>
        
    </body>
</html>
