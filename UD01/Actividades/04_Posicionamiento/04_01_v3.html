<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Posicionamiento - Ejercicio 1 - Versión Grid</title>
        <style>
            body {
                margin: 0;
            }
            .container {
                box-sizing: border-box;
                display: grid;
                height: 100vh;
                grid-template-columns: repeat(3, 1fr);
                border: 2px dotted black;
            }
            .blue {background-color: blue;}
            .white {background-color: white;}
            .red {background-color: red;}
        </style>
    </head>

    <body>
        <div class="container">
            <div class="blue"></div>
            <div class="white"></div>
            <div class="red"></div>
        </div>
        
    </body>
</html>
