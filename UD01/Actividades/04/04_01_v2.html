<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Posicionamiento - Ejercicio 1 - Versión Flex</title>
        <style>
            body {
                margin: 0;
            }
            .container {
                box-sizing: border-box;
                display: flex;
                height: 100vh;
                border: 2px dotted black;
            }
            .box {flex: 1;}
            .blue {background-color: blue;}
            .white {background-color: white;}
            .red {background-color: red;}
        </style>
    </head>

    <body>
        <div class="container">
            <div class="box blue"></div>
            <div class="box white"></div>
            <div class="box red"></div>
        </div>
        
    </body>
</html>
