<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Posicionamiento - Ejercicio 2 - Versión Flex</title>
        <style>
            body {
                margin: 0;
            }
            .container {
                box-sizing: border-box;
                display: flex;
                height: 100vh;
                padding: 50px;
                border: 2px dotted darkred;
            }
            .box {flex: 1;}
            .yellow {
                border: 2px solid darkslategrey;
                background-color: khaki;
            }
            .blue {
                border: 2px solid indianred;
                background-color: lightcyan;
            }

        </style>
    </head>

    <body>
        <div class="container">
            <div class="box yellow"></div>
            <div class="box blue"></div>
        </div>
        
    </body>
</html>
